<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Decision Table Builder</title>
<style>
  /* ========== 配色（Notion に合わせる。ライト基準、ダークは同じトークンを上書き） ========== */
  :root{
    color-scheme: light dark;
    --bg:#ffffff; --side:#f7f7f5; --panel:#ffffff; --panel2:rgba(55,53,47,.06); --panel3:rgba(55,53,47,.12);
    --ink:#37352f; --sub:rgba(55,53,47,.65); --faint:rgba(55,53,47,.4); --line:rgba(55,53,47,.09); --line2:rgba(55,53,47,.16);
    --accent:#2383e2; --accent-ink:#ffffff; --accent-soft:rgba(35,131,226,.14); --accent-ring:rgba(35,131,226,.5);
    --sel:rgba(35,131,226,.14); --na-bg:rgba(55,53,47,.025); --na-ink:rgba(55,53,47,.35);
    --danger:#eb5757; --ok:#448361; --warn:#d9730d;
    --tv-gray:#e3e2e0; --tv-gray-ink:#32302c; --tv-green:#dbeddb; --tv-green-ink:#1c3829; --tv-red:#ffe2dd; --tv-red-ink:#5d1715;
    --tv-blue:#d3e5ef; --tv-blue-ink:#183347; --tv-orange:#fadec9; --tv-orange-ink:#49290e; --tv-yellow:#fdecc8; --tv-yellow-ink:#402c1b;
    --tv-purple:#e8deee; --tv-purple-ink:#412454; --tv-pink:#f5e0e9; --tv-pink-ink:#4c2337; --tv-brown:#eee0da; --tv-brown-ink:#442a1e;
    --shadow-sm:rgba(15,15,15,.1) 0 0 0 1px, rgba(15,15,15,.1) 0 2px 4px;
    --shadow:rgba(15,15,15,.05) 0 0 0 1px, rgba(15,15,15,.1) 0 3px 6px, rgba(15,15,15,.2) 0 9px 24px;
    --r:4px; --r-lg:6px;
    --mono:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    --sans:ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", Meiryo, Helvetica, "Apple Color Emoji", Arial, sans-serif, "Segoe UI Emoji", "Segoe UI Symbol";
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#191919; --side:#202020; --panel:#252525; --panel2:rgba(255,255,255,.055); --panel3:rgba(255,255,255,.11);
      --ink:rgba(255,255,255,.81); --sub:rgba(255,255,255,.45); --faint:rgba(255,255,255,.28); --line:rgba(255,255,255,.094); --line2:rgba(255,255,255,.16);
      --accent:#529cca; --accent-ink:#ffffff; --accent-soft:rgba(82,156,202,.2); --accent-ring:rgba(82,156,202,.55);
      --sel:rgba(35,131,226,.28); --na-bg:rgba(255,255,255,.02); --na-ink:rgba(255,255,255,.3);
      --danger:#ff7369; --ok:#4dab9a; --warn:#ffa344;
      --tv-gray:#5a5a5a; --tv-gray-ink:rgba(255,255,255,.81); --tv-green:#2b593f; --tv-green-ink:rgba(255,255,255,.81); --tv-red:#6e3630; --tv-red-ink:rgba(255,255,255,.81);
      --tv-blue:#28456c; --tv-blue-ink:rgba(255,255,255,.81); --tv-orange:#854c1d; --tv-orange-ink:rgba(255,255,255,.81); --tv-yellow:#89632a; --tv-yellow-ink:rgba(255,255,255,.81);
      --tv-purple:#492f64; --tv-purple-ink:rgba(255,255,255,.81); --tv-pink:#69314c; --tv-pink-ink:rgba(255,255,255,.81); --tv-brown:#603b2c; --tv-brown-ink:rgba(255,255,255,.81);
      --shadow-sm:rgba(15,15,15,.2) 0 0 0 1px, rgba(15,15,15,.4) 0 2px 4px;
      --shadow:rgba(15,15,15,.2) 0 0 0 1px, rgba(15,15,15,.3) 0 3px 6px, rgba(15,15,15,.6) 0 9px 24px;
    }
  }
  :root[data-theme="dark"]{
    --bg:#191919; --side:#202020; --panel:#252525; --panel2:rgba(255,255,255,.055); --panel3:rgba(255,255,255,.11);
    --ink:rgba(255,255,255,.81); --sub:rgba(255,255,255,.45); --faint:rgba(255,255,255,.28); --line:rgba(255,255,255,.094); --line2:rgba(255,255,255,.16);
    --accent:#529cca; --accent-ink:#ffffff; --accent-soft:rgba(82,156,202,.2); --accent-ring:rgba(82,156,202,.55);
    --sel:rgba(35,131,226,.28); --na-bg:rgba(255,255,255,.02); --na-ink:rgba(255,255,255,.3);
    --danger:#ff7369; --ok:#4dab9a; --warn:#ffa344;
    --tv-gray:#5a5a5a; --tv-gray-ink:rgba(255,255,255,.81); --tv-green:#2b593f; --tv-green-ink:rgba(255,255,255,.81); --tv-red:#6e3630; --tv-red-ink:rgba(255,255,255,.81);
    --tv-blue:#28456c; --tv-blue-ink:rgba(255,255,255,.81); --tv-orange:#854c1d; --tv-orange-ink:rgba(255,255,255,.81); --tv-yellow:#89632a; --tv-yellow-ink:rgba(255,255,255,.81);
    --tv-purple:#492f64; --tv-purple-ink:rgba(255,255,255,.81); --tv-pink:#69314c; --tv-pink-ink:rgba(255,255,255,.81); --tv-brown:#603b2c; --tv-brown-ink:rgba(255,255,255,.81);
    --shadow-sm:rgba(15,15,15,.2) 0 0 0 1px, rgba(15,15,15,.4) 0 2px 4px;
    --shadow:rgba(15,15,15,.2) 0 0 0 1px, rgba(15,15,15,.3) 0 3px 6px, rgba(15,15,15,.6) 0 9px 24px;
  }
  :root[data-theme="light"]{color-scheme:light;}
  :root[data-theme="dark"]{color-scheme:dark;}

  /* ========== 土台 ========== */
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:14px; line-height:1.5;
    display:flex; flex-direction:column; height:100vh; overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  button,input,select,textarea{font-family:inherit; color:inherit; font-size:inherit;}
  button{cursor:pointer;}
  button:disabled{opacity:.35; cursor:default;}
  :focus-visible{outline:none; box-shadow:0 0 0 2px var(--accent-ring);}
  ::selection{background:var(--accent-soft);}
  .btn, .mini, .cell, .item, .seg button, .menu button, .add-btn, .gen-btn, .caret, .title-input, .item input, .chips button, .addrow, .addcol{
    transition:background-color .1s ease, color .1s ease, box-shadow .1s ease, opacity .1s ease;
  }
  @media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important;} }

  /* ========== 汎用ボタン（Notion のフラットなボタン） ========== */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px; height:28px; padding:0 8px;
    border:none; background:transparent; border-radius:var(--r); font-size:14px; font-weight:400; line-height:1; white-space:nowrap; color:var(--ink);
  }
  .btn:hover:not(:disabled){background:var(--panel2);}
  .btn:active:not(:disabled){background:var(--panel3);}
  .btn.warn:hover:not(:disabled){color:var(--danger);}
  .btn.primary{background:var(--accent); color:var(--accent-ink); font-weight:500; padding:0 10px;}
  .btn.primary:hover:not(:disabled){background:color-mix(in srgb, var(--accent) 88%, #000);}
  .btn.ghost{color:var(--sub);}
  .btn.ghost:hover:not(:disabled){color:var(--ink);}
  .btn.dim{color:var(--faint);}
  .btn .ic{font-size:14px; line-height:1; opacity:.8;}
  .sep{width:1px; height:16px; background:var(--line2); margin:0 4px; flex-shrink:0;}
  /* 表示が切り替わってもボタン幅が動かないよう、両方のラベルを重ねて置く */
  .tg{display:grid; justify-items:center; align-items:center;}
  .tg > span{grid-area:1 / 1; white-space:nowrap;}
  .tg > span.off{visibility:hidden;}

  /* ========== 上部バー ========== */
  header{
    display:flex; align-items:center; gap:8px; padding:0 12px; height:45px; flex-shrink:0;
    background:var(--bg); flex-wrap:wrap;
  }
  header .brand{display:flex; align-items:center; gap:8px; flex-shrink:0; padding:0 6px; height:28px; border-radius:var(--r);}
  .logo{
    width:20px; height:20px; border-radius:4px; flex-shrink:0; background:var(--ink); position:relative;
  }
  .logo::before, .logo::after{content:""; position:absolute; background:var(--bg); border-radius:1px;}
  .logo::before{left:5px; right:5px; top:6px; height:1.5px; box-shadow:0 3.5px 0 var(--bg), 0 7px 0 var(--bg);}
  .logo::after{top:4.5px; bottom:4.5px; left:9.25px; width:1.5px;}
  header h1{font-size:14px; margin:0; font-weight:500; line-height:1.2;}
  .crumb{color:var(--faint); font-size:14px; display:flex; align-items:center; gap:8px; min-width:0; flex:1;}
  .crumb .cur{color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .hdr-actions{display:flex; gap:2px; flex-wrap:wrap; align-items:center; margin-left:auto;}
  .hdr-actions .btn{font-size:14px;}
  #themeBtn{min-width:6em;}

  /* ========== 見出し（ページタイトル） ========== */
  .page-head{padding:22px 48px 0 48px; flex-shrink:0;}
  .title-input{
    width:100%; font-size:32px; font-weight:700; line-height:1.2; padding:2px 0; border:none; background:transparent; color:var(--ink); letter-spacing:-.01em;
  }
  .title-input:focus{outline:none; box-shadow:none;}
  .title-input::placeholder{color:var(--faint);}

  /* ========== サイドバー ========== */
  .body{flex:1; display:flex; min-height:0;}
  aside{
    width:288px; flex-shrink:0; background:var(--side);
    padding:10px 8px 24px; overflow-y:auto; display:flex; flex-direction:column; gap:16px;
  }
  aside h2{
    font-size:12px; color:var(--sub); margin:0 0 2px; font-weight:500; padding:4px 8px; height:28px;
    display:flex; align-items:center; gap:8px;
  }
  .item{
    position:relative; display:flex; flex-direction:column; gap:2px; padding:6px 6px 8px 8px; margin-bottom:2px;
    border-radius:var(--r); background:transparent;
  }
  .item:hover{background:var(--panel2);}
  .item:focus-within{background:var(--panel2);}
  .item .top{display:flex; gap:2px; align-items:center;}
  .item .top > .tag{margin-right:4px;}
  .item input[type=text]{
    flex:1; min-width:0; height:26px; padding:0 6px; border:none; border-radius:3px;
    font-size:14px; background:transparent; color:var(--ink);
  }
  .item .top input[type=text]{font-weight:500;}
  .item input[type=text]:hover{background:var(--panel2);}
  .item input[type=text]:focus{background:var(--bg); box-shadow:0 0 0 2px var(--accent-ring); outline:none;}
  .item input[type=text]::placeholder{color:var(--faint); font-weight:400;}
  .item .mini{
    border:none; background:transparent; color:var(--faint); font-size:13px; line-height:1;
    width:24px; height:24px; border-radius:3px; display:inline-flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .item .mini:hover:not(:disabled){background:var(--panel3); color:var(--ink);}
  .item .mini.x:hover:not(:disabled){color:var(--danger);}
  @media (hover:hover){
    .item .mini{opacity:0;}
    .item:hover .mini, .item:focus-within .mini, .item .mini:focus-visible{opacity:1;}
  }
  .item .vals{display:flex; flex-direction:column; gap:3px;}
  .item .vals input, .item .frow input{font-size:13px; height:26px; color:var(--sub);}
  .item .vals input:focus, .item .frow input:focus{color:var(--ink);}
  .item.grouped{box-shadow:inset 2px 0 0 var(--tv-blue-ink); }
  :root[data-theme="dark"] .item.grouped{box-shadow:inset 2px 0 0 var(--accent);}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .item.grouped{box-shadow:inset 2px 0 0 var(--accent);} }
  .item .frow{display:flex; align-items:center; gap:4px;}
  .item .frow .flabel{font-size:12px; color:var(--faint); flex-shrink:0; white-space:nowrap; width:5em; padding-left:6px;}
  .item .frow .combobox{flex:1; min-width:0;}
  .item .frow .combobox > input{padding-right:24px;}
  .item .frow .combobox .caret{right:2px; top:2px; bottom:2px;}
  .item .vals{padding-left:0;}
  .item .vals > input{padding-left:6px;}
  .chips{display:flex; gap:4px; flex-wrap:wrap; padding:2px 0 0 6px;}
  .chips button{
    font-size:12px; padding:0 6px; height:20px; border-radius:3px; border:none; background:var(--tv-gray); color:var(--tv-gray-ink); opacity:.8;
  }
  .chips button:hover{opacity:1;}
  .tag{
    display:inline-flex; align-items:center; font-family:var(--mono); font-size:11px; font-weight:500; padding:0 5px; height:18px; border-radius:3px;
    line-height:1; flex-shrink:0;
  }
  .tag.c{background:var(--tv-blue); color:var(--tv-blue-ink);}
  .tag.a{background:var(--tv-orange); color:var(--tv-orange-ink);}
  th .tag{margin-right:6px; vertical-align:1px;}
  .add-btn{
    width:100%; height:28px; padding:0 8px; border:none; background:transparent;
    color:var(--sub); border-radius:var(--r); font-size:14px; text-align:left;
  }
  .add-btn:hover{background:var(--panel2); color:var(--ink);}
  .gen-btn{
    width:100%; height:32px; padding:0 12px; border:none; border-radius:var(--r);
    background:var(--accent); color:var(--accent-ink); font-size:14px; font-weight:500;
  }
  .gen-btn:hover{background:color-mix(in srgb, var(--accent) 88%, #000);}
  .gen-btn small{font-weight:400; opacity:.8; margin-left:6px; font-size:12px;}
  .hint{
    font-size:12px; color:var(--sub); line-height:1.7; margin:auto 0 0; padding:8px;
  }
  .hint kbd, .dlg-note kbd, table.keys kbd{
    font-family:var(--mono); font-size:11px; border-radius:3px; padding:1px 5px; background:var(--panel2); color:var(--ink);
  }

  /* ========== ビュー切替（Notion のデータベースヘッダー） ========== */
  main{flex:1; display:flex; flex-direction:column; min-width:0; background:var(--bg);}
  .toolbar{
    display:flex; gap:2px; padding:14px 48px 0; border-bottom:1px solid var(--line);
    background:var(--bg); flex-wrap:wrap; flex-shrink:0; align-items:center;
  }
  .toolbar .spacer{flex:1; min-width:8px;}
  .toolbar .btn{height:28px; margin-bottom:6px; color:var(--sub); font-size:14px;}
  .toolbar .btn:hover:not(:disabled){color:var(--ink);}
  .toolbar .btn.primary, .toolbar .btn.primary:hover{color:var(--accent-ink);}
  .toolbar .sep{margin-bottom:6px;}
  .seg{display:inline-flex; gap:2px; margin-right:8px; align-self:stretch;}
  .seg button{
    height:34px; padding:0 8px; border:none; background:transparent; font-size:14px; font-weight:500; color:var(--sub); border-radius:var(--r) var(--r) 0 0;
    position:relative; display:inline-flex; align-items:center; gap:6px;
  }
  .seg button::before{content:"⊞"; font-size:14px; opacity:.7;}
  .seg button[data-layout="h"]::before{content:"☰";}
  .seg button:hover{background:var(--panel2); color:var(--ink);}
  .seg button.active{color:var(--ink);}
  .seg button.active::after{content:""; position:absolute; left:0; right:0; bottom:-1px; height:2px; background:var(--ink); border-radius:1px;}

  .status{
    display:flex; gap:6px; flex-wrap:wrap; align-items:center; padding:10px 48px 0; min-height:30px; font-size:12px; flex-shrink:0;
  }
  .status:empty{display:none;}
  .badge{
    display:inline-flex; align-items:center; gap:6px; height:22px; padding:0 8px; border-radius:3px;
    border:none; color:var(--sub); background:var(--panel2); font-variant-numeric:tabular-nums; font-weight:400;
  }
  .badge.ok{color:var(--ok); background:var(--tv-green);}
  .badge.ok::before{content:""; width:6px; height:6px; border-radius:50%; background:var(--ok); flex-shrink:0;}
  .badge.warn{color:var(--warn); background:var(--tv-orange);}
  .badge.warn::before{content:""; width:6px; height:6px; border-radius:50%; background:var(--warn); flex-shrink:0;}
  details.badge{position:relative; cursor:pointer;}
  details.badge:hover{filter:brightness(.96);}
  details.badge summary{list-style:none; display:inline-flex; align-items:center;}
  details.badge summary::-webkit-details-marker{display:none;}
  details.badge summary::after{content:"▾"; margin-left:5px; opacity:.6; font-size:11px;}
  details.badge ul{
    position:absolute; top:calc(100% + 6px); left:0; z-index:30; background:var(--panel);
    border-radius:var(--r-lg); padding:8px 12px 8px 26px; margin:0; min-width:280px; max-width:560px; max-height:260px; overflow:auto;
    box-shadow:var(--shadow); font-family:var(--mono); font-size:12px; color:var(--ink); white-space:nowrap; line-height:1.8; font-weight:400;
  }
  .selinfo{color:var(--sub); margin-left:auto; font-variant-numeric:tabular-nums;}

  .tableWrap{flex:1; overflow:auto; padding:8px 48px 40px;}
  .empty{
    display:flex; align-items:center; justify-content:flex-start; padding-top:24px; height:100%; color:var(--sub); font-size:14px;
    text-align:left; flex-direction:column; gap:4px; line-height:1.7; align-items:flex-start;
  }
  .empty .addrow{margin-top:8px;}

  /* ========== 表（Notion のテーブルビュー） ========== */
  table.dt{
    border-collapse:separate; border-spacing:0; font-size:14px; background:var(--bg); font-variant-numeric:tabular-nums;
  }
  .dt th, .dt td{border-right:1px solid var(--line); border-bottom:1px solid var(--line); padding:0 8px; height:33px; text-align:center; white-space:nowrap; background:var(--bg);}
  .dt thead tr:first-child th{border-top:1px solid var(--line);}
  .dt tr > :first-child{border-left:1px solid var(--line);}
  .dt thead th{position:sticky; top:0; z-index:2; background:var(--bg); font-weight:400; color:var(--sub); font-size:14px;}
  .dt tr.grp th{
    font-size:12px; font-weight:500; padding:0 8px; height:30px; text-align:left; color:var(--sub);
  }
  .dt tr.grp th.cond-h, .dt tr.grp th.act-h, .dt tr.gsub th{background:var(--bg);}
  .dt tr.grp th.cond-h::before, .dt tr.grp th.act-h::before{content:""; display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:8px; vertical-align:-1px; background:var(--tv-blue-ink); opacity:.55;}
  .dt tr.grp th.act-h::before{background:var(--tv-orange-ink);}
  .dt th.note-h, .dt th.no, .dt th.chk{color:var(--faint); font-weight:400;}
  .dt td.no{color:var(--faint); font-size:12px;}
  .dt tbody tr:hover > td{background:color-mix(in srgb, var(--panel2) 50%, var(--bg));}
  .dt tr.sel td, .dt td.sel{background:var(--sel) !important;}
  .dt tr.na td, .dt td.na{background:var(--na-bg) !important; color:var(--na-ink);}
  .dt tr.na td .cell, .dt td.na .cell{color:var(--na-ink);}
  .dt tr.na td .tagv, .dt td.na .tagv{opacity:.45;}
  .dt tr.na td.no{text-decoration:line-through;}
  /* 縦表：見出し列は左に固定。グループ列があるときはその幅（--gw）だけ右へずらす */
  .dt.v th.lbl{position:sticky; left:var(--gw, 0px); z-index:1; text-align:left; background:var(--bg); padding:0 10px; color:var(--ink); font-weight:400;}
  .dt.v th.lbl.cond-h, .dt.v th.lbl.act-h{color:var(--ink); background:var(--bg);}
  .dt.v th.gname{
    position:sticky; left:0; z-index:1; text-align:left; background:var(--bg);
    font-weight:400; font-size:13px; color:var(--sub); padding:0 10px;
  }
  .dt.v th.gname.cond-h, .dt.v th.gname.act-h, .dt.v th.gname.note-h{background:var(--bg);}
  .dt.v th.gname.cont{border-top:none;}
  .dt.v thead th.corner{z-index:3;}
  .dt.v th.rule-h{font-weight:400; min-width:3.6em; color:var(--sub); font-size:13px;}
  .dt.v th.rule-h.na{color:var(--na-ink); text-decoration:line-through; background:var(--na-bg);}
  .dt.v th.rule-h.sel{background:var(--sel); color:var(--ink);}
  .dt.v th.rule-h label, .dt.v th.corner label{cursor:pointer; display:inline-flex; gap:6px; align-items:center;}
  .dt.v th.corner label{font-weight:400; font-size:13px; color:var(--sub);}
  .dt.v tr.grp th.sect{position:sticky; left:0; z-index:1; text-align:left;}
  .dt.h th.gspan{font-weight:400; font-size:12px; color:var(--sub);}
  .dt.h thead tr:last-child th.cond-h, .dt.h thead tr:last-child th.act-h{color:var(--sub); background:var(--bg); text-align:left;}
  .dt.h thead tr:last-child th{text-align:left;}
  .dt.h thead tr:last-child th.chk, .dt.h thead tr:last-child th.no{text-align:center;}
  .dt.h tr.grp th.cond-h, .dt.h tr.grp th.act-h{color:var(--sub);}
  /* Notion の「+ 新規」行と「+」列 */
  .dt td.addrow, .dt th.addcol{color:var(--faint); text-align:left; cursor:pointer; user-select:none; padding:0 8px; font-size:14px;}
  .dt td.addrow:hover, .dt th.addcol:hover{background:var(--panel2); color:var(--sub);}

<script>
(function(){
'use strict';

/* ======================================================================
 * 定数と DOM 参照
 * ====================================================================== */
const LS_KEY    = 'decision-table-builder.v2';
const THEME_KEY = 'decision-table-builder.theme';
const MAX_ROWS  = 4096;                   // 生成と網羅チェックの上限（組み合わせ数）
const DASH      = '-';                    // 「この条件は結果に影響しない」を表す値
const YES       = '○', NO = '×';
const YES_NO    = [YES, NO];              // 条件の値の既定。動作セルの候補にも使う
const PRESETS   = [YES_NO.join(', ')];    // 条件の値のテンプレート
const NA_LABEL  = '対象外';               // 「発生しない組み合わせ」の表示名

const $ = s => document.querySelector(s);
const dom = {
  sidebar: $('aside'), condList: $('#conditionList'), actList: $('#actionList'), comboCount: $('#comboCount'),
  title: $('#titleInput'), table: $('#tableWrap'), status: $('#status'), layoutSeg: $('#layoutSeg'),
  naBtn: $('#naBtn'), deleteBtn: $('#deleteBtn'), selToggle: $('#selToggleBtn'), themeBtn: $('#themeBtn'),
  keysDlg: $('#keysDlg'), keysHead: $('#keysHead'), keysBody: $('#keysBody'),
  toast: $('#toast'), jsonFile: $('#jsonFile'), comboMenu: $('#comboMenu'), rowMenu: $('#rowMenu'), crumb: $('#crumbTitle'),
};

/* ======================================================================
 * 汎用ユーティリティ
 * ====================================================================== */
const escH = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const byId = (arr, id) => arr.find(x => x.id === id);
const uniq = arr => [...new Set(arr)];
const sameList = (a, b) => JSON.stringify(a) === JSON.stringify(b);
const cartesian = arrs => arrs.reduce((acc, cur) => acc.flatMap(a => cur.map(c => [...a, c])), [[]]);
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
/* 画面からはみ出さないように、メニューの左上を決める */
function placeMenu(menu, x, y){
  menu.style.left = menu.style.top = '0px';   // 端に寄ったまま測ると幅が縮むので、いったん左上へ
  menu.style.left = clamp(x, 8, window.innerWidth  - menu.offsetWidth  - 8) + 'px';
  menu.style.top  = clamp(y, 8, window.innerHeight - menu.offsetHeight - 8) + 'px';
}

/* 全角文字を 2、それ以外を 1 として表示幅を数える（Markdown の桁そろえと列幅の見積もりに使う） */
const WIDE = /[ᄀ-ᅟ⺀-〾ぁ-㏿㐀-䶿一-鿿ꀀ-꓏가-힣豈-﫿︰-﹏＀-｠￠-￦①-⓿■-◿☀-➿　]/;
const dispW = s => { let w = 0; for (const ch of String(s)) w += WIDE.test(ch) ? 2 : 1; return w; };
const mdEsc = s => String(s ?? '').replace(/\|/g, '\\|').replace(/\r?\n+/g, ' ').trim();

function parseValues(str){
  const v = uniq(String(str).split(/[,、，]/).map(s => s.trim()).filter(s => s && s !== DASH));
  return v.length ? v : [...YES_NO];
}
function focusField(selector){
  const el = dom.sidebar.querySelector(selector);
  if (el) { el.focus(); el.select(); }
}

/* ======================================================================
 * データモデル
 *   state = { title, conditions:[{id,name,values,group}], actions:[{id,name,type}], rows:[{id,cond,act,na,note}], layout }
 * ====================================================================== */
let uid = 1;
const nid = () => uid++;
let state = null;

function fixUid(){ uid = 1 + Math.max(0, ...[...state.conditions, ...state.actions, ...state.rows].map(x => x.id)); }

const blank   = () => ({ title:'', conditions:[], actions:[], rows:[], layout:'v' });
const newCond = (name, group = '') => ({ id:nid(), name, values:[...YES_NO], group });
const newAct  = name => ({ id:nid(), name });

function starter(){
  const s = blank();
  s.conditions = [newCond('条件1'), newCond('条件2')];
  s.actions = [newAct('動作1')];
  return s;
}
function sample(){
  const rank = { id:nid(), name:'会員ランク', values:['無料', '有料'], group:'会員' };
  const amt  = { id:nid(), name:'購入金額 5,000円以上', values:[...YES_NO], group:'注文' };
  const free = newAct('送料無料');
  const s = blank();
  s.title = 'ECサイト 送料無料の判定';
  s.conditions = [rank, amt]; s.actions = [free];
  s.rows = cartesian([rank.values, amt.values]).map(([r, a]) => ({
    id:nid(), cond:{ [rank.id]:r, [amt.id]:a }, na:false, note:'',
    act:{ [free.id]: (r === '有料' || a === YES) ? YES : NO },
  }));
  return s;
}
function newRow(){
  const r = { id:nid(), cond:{}, act:{}, na:false, note:'' };
  state.conditions.forEach(c => r.cond[c.id] = DASH);
  state.actions.forEach(a => r.act[a.id] = '');
  return r;
}
/* id を持たないルールの中身。コピーと複製で使う */
const rowData  = r => ({ cond:{ ...r.cond }, act:{ ...r.act }, na:!!r.na, note:r.note || '' });
const cloneRow = r => ({ id:nid(), ...rowData(r) });

const condVal   = (r, c) => r.cond[c.id] ?? DASH;
const actVal    = (r, a) => r.act[a.id] || '';
const groupOf   = c => (c.group || '').trim();
const ruleLabel = (n, na) => na ? `~~R${n}~~` : `R${n}`;
const comboTotal = () => state.conditions.length ? state.conditions.reduce((n, c) => n * c.values.length, 1) : 0;
const hasCondGroups = () => state.conditions.some(groupOf);
/* ルール r が条件の値の組み合わせ combo（state.conditions と同じ並び）に当てはまるか。「-」は何にでも当たる */
const matchesCombo = (r, combo) => state.conditions.every((c, k) => { const v = condVal(r, c); return v === DASH || v === combo[k]; });
/* ルールの中身を比べるための文字列。skip に渡した条件は無視する */
const rowKey = (r, skip) => JSON.stringify([
  r.na, r.note || '', state.actions.map(a => actVal(r, a)), state.conditions.filter(c => c !== skip).map(c => condVal(r, c)),
]);

/* 連続する同じグループ名の条件をひとまとまり（run）にする */
function condRuns(){
  const runs = [];
  for (const c of state.conditions) {
    const g = groupOf(c), last = runs[runs.length - 1];
    if (last && last.group === g) last.items.push(c); else runs.push({ group:g, items:[c] });
  }
  return runs;
}

/* 外から来た JSON を、このツールが扱える形に整える。形が違えば null */
function validate(obj){
  if (!obj || typeof obj !== 'object' || ![obj.conditions, obj.actions, obj.rows].every(Array.isArray)) return null;
  const s = blank();
  s.title = String(obj.title ?? '');
  s.layout = obj.layout === 'h' ? 'h' : 'v';
  s.conditions = obj.conditions.map(c => ({
    id:+c.id, name:String(c.name ?? ''), group:String(c.group ?? ''),
    values:Array.isArray(c.values) && c.values.length ? c.values.map(String) : [...YES_NO],
  }));
  s.actions = obj.actions.map(a => ({ id:+a.id, name:String(a.name ?? '') }));
  s.rows = obj.rows.map(r => ({ id:+r.id, ...rowData({ cond:r.cond || {}, act:r.act || {}, na:r.na, note:String(r.note || '') }) }));
  return s;
}

/* ======================================================================
 * 履歴（元に戻す／やり直す）
 *   snapshot()  … 操作の直前に呼ぶ
 *   beginEdit() / touchEdit() … 文字入力は「フォーカスした時点」を1回だけ履歴に載せる
 * ====================================================================== */
const history = { undo:[], redo:[] };
let pending = null;

function pushUndo(json){ history.undo.push(json); if (history.undo.length > 120) history.undo.shift(); history.redo.length = 0; }
function snapshot(){ pending = null; pushUndo(JSON.stringify(state)); }
function beginEdit(){ pending = JSON.stringify(state); }
function touchEdit(){ if (pending !== null) { pushUndo(pending); pending = null; } }
/* 入力中なら打ち始めの状態を、そうでなければ今の状態を履歴に残す */
function recordEdit(){ if (pending !== null) touchEdit(); else snapshot(); }
function undo(){
  if (!history.undo.length) return toast('元に戻す操作はありません');
  history.redo.push(JSON.stringify(state)); restore(history.undo.pop());
}
function redo(){
  if (!history.redo.length) return toast('やり直す操作はありません');
  history.undo.push(JSON.stringify(state)); restore(history.redo.pop());
}
function restore(json){ pending = null; setState(JSON.parse(json)); }

/* ======================================================================
 * 保存と読み込み
 * ====================================================================== */
function persist(){ try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {} }
function load(){
  try { const s = validate(JSON.parse(localStorage.getItem(LS_KEY))); if (s) return s; } catch (e) {}
  return sample();
}
/* 表全体を差し替えて描き直す。選択は持ち越さない */
function setState(next){ state = next; fixUid(); selected.clear(); renderAll(); }
/* 履歴に残しつつ表全体を置き換える（サンプル・新規・JSON 読込で共通） */
function replaceState(next, msg){ snapshot(); setState(next); toast(msg, true); }

/* ======================================================================
 * 選択（ルールの選択状態は state に含めない）
 * ====================================================================== */
let selected = new Set();
let lastClickedRow = null;

const selRows = () => state.rows.filter(r => selected.has(r.id));
function needSel(){
  const s = selRows();
  if (s.length) return s;
  toast('ルールを選択してください（縦表は列見出し、横表は行頭のチェック）');
  return null;
}
function setSelected(id, on){
  if (on) selected.add(id); else selected.delete(id);
  dom.table.querySelectorAll(`tr[data-rid="${id}"], th[data-rid="${id}"], td[data-rid="${id}"]`).forEach(el => el.classList.toggle('sel', on));
  dom.table.querySelectorAll(`.rowsel[data-rid="${id}"]`).forEach(cb => cb.checked = on);
}
/* Shift+クリック：前回クリックした行との間をまとめて選ぶ */
function selectRange(toId, on){
  const a = state.rows.findIndex(r => r.id === lastClickedRow), b = state.rows.findIndex(r => r.id === toId);
  if (a < 0 || b < 0) return setSelected(toId, on);
  for (let i = Math.min(a, b); i <= Math.max(a, b); i++) setSelected(state.rows[i].id, on);
}
function toggleState(){
  const sel = selRows();
  return {
    allSelected: !!state.rows.length && selected.size === state.rows.length,
    naOn: !!sel.length && sel.every(r => r.na),
  };
}
/* トグルボタンは、今押すと何が起きるかをラベルにする（幅を変えないため2枚重ねを切り替える） */
function swapLabel(btn, alt){
  const [main, sub] = btn.querySelectorAll('.tg > span');
  if (!sub) return;
  main.classList.toggle('off', !!alt);
  sub.classList.toggle('off', !alt);
}
function updateSelUI(){
  const all = $('#selAllChk');
  if (all) { const n = selected.size, t = state.rows.length; all.checked = n > 0 && n === t; all.indeterminate = n > 0 && n < t; }
  const info = $('#selInfo'); if (info) info.textContent = selected.size ? `${selected.size} 件選択中` : '';
  const t = toggleState();
  swapLabel(dom.selToggle, t.allSelected);
  swapLabel(dom.naBtn, t.naOn);
  [dom.naBtn, dom.deleteBtn].forEach(b => b.classList.toggle('dim', !selected.size));
}

/* ======================================================================
 * 通知
 * ====================================================================== */
let toastTimer;
function toast(msg, withUndo){
  dom.toast.innerHTML = escH(msg) + (withUndo ? '<button type="button" id="toastUndo">元に戻す</button>' : '');
  dom.toast.classList.add('show');
  const u = $('#toastUndo'); if (u) u.addEventListener('click', () => { undo(); dom.toast.classList.remove('show'); });
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => dom.toast.classList.remove('show'), withUndo ? 4500 : 2000);
}

/* ======================================================================
 * 描画：サイドバー（条件と動作の定義）
 * ====================================================================== */
/* 直接入力もでき、▾ から既存の値も選べる欄。候補は開くときに作る（combo 参照） */
function comboField(attrs, value, cls, opt = {}){
  return `<span class="combobox">`
    + `<input type="text"${cls ? ` class="${cls}"` : ''} value="${escH(value)}" ${attrs} autocomplete="off"`
    + (opt.readonly ? ' readonly' : '')
    + ` role="combobox" aria-expanded="false" aria-autocomplete="list"`
    + (opt.placeholder ? ` placeholder="${escH(opt.placeholder)}"` : '')
    + (opt.label ? ` aria-label="${escH(opt.label)}"` : '')
    + (opt.title ? ` title="${escH(opt.title)}"` : '') + '>'
    + `<button type="button" class="caret" tabindex="-1" aria-label="候補を開く"></button></span>`;
}
const groupField = c => comboField(`data-role="cgroup"`, c.group || '', '', {
  placeholder: `${DASH}（グループなし）`, label:'条件のグループ',
  title:'直接入力するか、▾ から選べます',
});
/* グループの候補：なし + すでに使われているグループ名 */
const groupOptions = () => [
  { value:'', label:`${DASH}（グループなし）` },
  ...uniq(state.conditions.map(groupOf).filter(Boolean)).map(n => ({ value:n, label:n })),
];
/* 動作の候補：○ / × と、その列ですでに使った値 + 空欄 */
const actionOptions = a => [
  ...uniq([...YES_NO, ...state.rows.map(r => actVal(r, a)).filter(Boolean)]).map(v => ({ value:v, label:v, color:tagColor(v) })),
  { value:'', label:'（空欄）', color:'none' },
];
/* 条件の候補：定義した値 + 「-」 */
const condOptions = c => [
  ...c.values.map(v => ({ value:v, label:v, color:tagColor(v, c.values) })),
  { value:DASH, label:`${DASH}（この条件は影響しない）`, color:'none' },
];
const moveBtns = (prefix, i, n) =>
  `<button class="mini" data-role="${prefix}up" title="上へ" ${i === 0 ? 'disabled' : ''}>↑</button>` +
  `<button class="mini" data-role="${prefix}down" title="下へ" ${i === n - 1 ? 'disabled' : ''}>↓</button>`;

function renderSidebar(){
  const C = state.conditions, A = state.actions;
  dom.condList.innerHTML = C.map((c, i) => `
    <div class="item${groupOf(c) ? ' grouped' : ''}" data-id="${c.id}">
      <div class="top">
        <span class="tag c">C${i+1}</span>
        <input type="text" data-role="cname" value="${escH(c.name)}" placeholder="条件名" aria-label="条件名">

      </div>
      <div class="vals">
        <input type="text" data-role="cvals" value="${escH(c.values.join(', '))}" placeholder="値をカンマ区切り (例: ○, ×)" title="Enter またはフォーカスを外すと反映されます" aria-label="条件の値">
        <span class="chips">${PRESETS.map(p => `<button type="button" data-role="preset" data-vals="${escH(p)}">${escH(p)}</button>`).join('')}</span>
      </div>

/* ======================================================================
 * 描画：表
 * ====================================================================== */
/* 値のタグの色（Notion のセレクトと同じ見え方）。○ は緑、× は赤、- と空欄は無色、それ以外は値の並び順で色を回す */
const TV_COLORS = ['blue', 'purple', 'orange', 'pink', 'yellow', 'brown', 'gray'];
function tagColor(v, list){
  if (v === YES) return 'green';
  if (v === NO) return 'red';
  if (v === DASH || v === '') return 'none';
  const i = list ? list.indexOf(v) : -1;
  return i < 0 ? 'gray' : TV_COLORS[i % TV_COLORS.length];
}
const tagHtml = (color, label) => `<span class="tagv tv-${color}">${escH(label)}</span>`;
const tagv = (v, list) => tagHtml(tagColor(v, list), v);
const markClass = v => v === YES ? 'on' : v === NO ? 'off' : '';
const cellClass = cls => 'cell' + (cls ? ' ' + cls : '');
/* 値に応じてクラスを付け直す。入力モードの印だけは消さずに残す */
const setCellClass = (el, cls) => { el.className = cellClass(cls) + (inputCell === el ? ' editing' : ''); };
const pickClass = v => 'pick' + (v === DASH ? ' dash' : '');
/* セルの中身だけを作り直し、新しい要素にフォーカスを移す（表全体は描き直さない） */
function replaceCell(el, html, focus = true){
  const td = el.closest('td'); if (!td) return null;
  td.innerHTML = html;
  const next = td.querySelector('.cell');
  if (focus && next) next.focus();
  return next;
}

/* 条件セル：Notion のセレクトと同じく、クリックか Enter でタグの一覧を開いて選ぶ */
function condCell(r, c){
  const v = condVal(r, c);
  return `<button type="button" class="${cellClass(pickClass(v))}" data-rid="${r.id}" data-cid="${c.id}" data-val="${escH(v)}"`
    + ` aria-haspopup="listbox" aria-label="${escH(c.name)}" title="${escH(`${c.name}　Enter かクリックで値を選ぶ`)}">${tagv(v, c.values)}</button>`;
}
/* 動作セル：ふだんはタグのボタン（Enter かクリックで候補、文字を打つと入力欄に変わる） */
function actCell(r, a){
  const v = actVal(r, a);
  return `<button type="button" class="${cellClass('pick act ' + markClass(v))}" data-rid="${r.id}" data-aid="${a.id}" data-val="${escH(v)}"`
    + ` aria-haspopup="listbox" aria-label="${escH(a.name)}" title="${escH(`${a.name}　Enter かクリックで候補、文字を打つと自由入力`)}">${v ? tagv(v) : ''}</button>`;
}
/* 動作セルの入力欄（入力モードのときだけ置き換えて使う） */
function actInput(r, a){
  const v = actVal(r, a);
  return comboField(`data-rid="${r.id}" data-aid="${a.id}"`, v, cellClass(markClass(v) + ' editing'), {
    placeholder:'自由入力', label:a.name,
    title:`${a.name}　Esc で戻る。↓ で候補`,
  });
}
const noteCell = r => `<input type="text" class="cell note" value="${escH(r.note || '')}" data-rid="${r.id}" placeholder="備考" aria-label="備考" title="Enter で入力モード、Esc で移動モード" readonly>`;

const rowCls   = r => `${r.na ? 'na' : ''} ${selected.has(r.id) ? 'sel' : ''}`.trim();
const ruleChk  = (r, i) => `<input type="checkbox" class="rowsel" data-rid="${r.id}"${selected.has(r.id) ? ' checked' : ''} aria-label="ルール ${i+1} を選択">`;
const condHead = (c, i) => `<span class="tag c">C${i+1}</span>${escH(c.name)}`;
const actHead  = (a, i) => `<span class="tag a">A${i+1}</span>${escH(a.name)}`;
const emptyMsg = msg => `<div class="empty">${msg}</div>`;

/* 横表：1ルール = 1行 */
function tableH(C, A, R){
  let h = '<table class="dt h"><thead>';
  h += `<tr class="grp"><th class="chk"></th><th class="no"></th>`
     + (C.length ? `<th class="cond-h" colspan="${C.length}">条件</th>` : '')
     + (A.length ? `<th class="act-h" colspan="${A.length}">動作 / 結果</th>` : '')
     + '<th class="note-h"></th></tr>';
  if (hasCondGroups()) {
    h += '<tr class="gsub"><th class="chk"></th><th class="no"></th>'
       + condRuns().map(run => `<th class="cond-h gspan" colspan="${run.items.length}">${escH(run.group)}</th>`).join('')
       + (A.length ? `<th class="act-h" colspan="${A.length}"></th>` : '') + '<th class="note-h"></th></tr>';
  }
  h += '<tr><th class="chk"><input type="checkbox" id="selAllChk" title="全選択"></th><th class="no">#</th>'
     + C.map((c, i) => `<th class="cond-h">${condHead(c, i)}</th>`).join('')
     + A.map((a, i) => `<th class="act-h">${actHead(a, i)}</th>`).join('')
     + '<th class="note-h">備考</th></tr></thead><tbody>';
  h += R.map((r, i) =>
    `<tr data-rid="${r.id}" class="${rowCls(r)}"><td class="chk">${ruleChk(r, i)}</td><td class="no">${i+1}</td>`
    + C.map(c => `<td class="cond-c">${condCell(r, c)}</td>`).join('')
    + A.map(a => `<td class="act-c">${actCell(r, a)}</td>`).join('')
    + `<td class="note-c">${noteCell(r)}</td></tr>`).join('');
  h += `<tr class="addtr"><td class="addrow" colspan="${C.length + A.length + 3}" title="ルールを追加">+ 新規</td></tr>`;
  return h + '</tbody></table>';
}

/* 縦表：1ルール = 1列（伝統的なディシジョンテーブル） */
function tableV(C, A, R){
  const groups = hasCondGroups();
  const gcol  = (text, tint, cont) => groups ? `<th class="gname ${tint}${cont ? ' cont' : ''}">${text}</th>` : '';
  const pad   = '<td class="addpad"></td>';
  const cells = (cls, fn) => R.map(r => `<td class="${cls} ${rowCls(r)}" data-rid="${r.id}">${fn(r)}</td>`).join('') + pad;
  const span  = R.length + (groups ? 2 : 1);
  let h = '<table class="dt v"><thead><tr>' + (groups ? '<th class="gname corner"></th>' : '')
        + '<th class="lbl corner"><label><input type="checkbox" id="selAllChk"> 全選択</label></th>'
        + R.map((r, i) => `<th class="rule-h ${rowCls(r)}" data-rid="${r.id}"><label>${ruleChk(r, i)} R${i+1}</label></th>`).join('')
        + '<th class="addcol" title="ルールを追加">+</th></tr></thead><tbody>';
  if (C.length) {
    h += `<tr class="grp"><th class="sect cond-h" colspan="${span}">条件</th>${pad}</tr>`;
    let ci = 0;
    for (const run of condRuns()) run.items.forEach((c, k) => {
      h += `<tr>${gcol(k ? '' : escH(run.group), 'cond-h', k > 0)}<th class="lbl cond-h">${condHead(c, ci++)}</th>${cells('cond-c', r => condCell(r, c))}</tr>`;
    });
  }
  if (A.length) {
    h += `<tr class="grp"><th class="sect act-h" colspan="${span}">動作 / 結果</th>${pad}</tr>`;
    A.forEach((a, i) => { h += `<tr>${gcol('', 'act-h', i > 0)}<th class="lbl act-h">${actHead(a, i)}</th>${cells('act-c', r => actCell(r, a))}</tr>`; });
  }
  h += `<tr>${gcol('', 'note-h', false)}<th class="lbl note-h">備考</th>${cells('note-c', noteCell)}</tr>`;
  return h + '</tbody></table>';
}

function renderTable(){
  inputCell = null; closeCombo(); closeRowMenu();   // 作り直すと元の要素は消えるので、モードやメニューも畳む
  const { conditions:C, actions:A, rows:R } = state;
  if (!C.length && !A.length) { dom.table.innerHTML = emptyMsg('左のパネルで条件と動作を追加してください'); return; }
  if (!R.length) { dom.table.innerHTML = emptyMsg('「全組み合わせで表を生成」を押すとルールが作られます<br><span style="font-size:12px">必要なルールだけ手で作る場合は「+ 新規」</span><button type="button" class="btn addrow">+ 新規</button>'); return; }
  dom.table.innerHTML = state.layout === 'h' ? tableH(C, A, R) : tableV(C, A, R);
  updateSelUI();
  layoutSticky();
}

/* 見出し行を積み重ねて固定し、縦表ではグループ列の幅だけ見出し列をずらす */
function layoutSticky(){
  const t = dom.table.querySelector('table.dt'); if (!t) return;
  let top = 0;
  t.querySelectorAll('thead tr').forEach(tr => {
    tr.querySelectorAll('th').forEach(th => th.style.top = top + 'px');
    top += tr.getBoundingClientRect().height;
  });
  const g = t.querySelector('tbody th.gname');
  t.style.setProperty('--gw', g ? g.getBoundingClientRect().width + 'px' : '0px');
}

/* ======================================================================
 * 描画：チェック結果（状態バー）
 * ====================================================================== */
/* 全組み合わせを走査し、どのルールにも当たらないもの／複数に当たるものを集める */
function coverage(){
  const C = state.conditions, total = comboTotal();
  if (!C.length) return null;
  if (total > MAX_ROWS) return { skipped:true, total };
  const uncovered = [], dup = [];
  for (const combo of cartesian(C.map(c => c.values))) {
    const hits = [];
    state.rows.forEach((r, i) => { if (matchesCombo(r, combo)) hits.push(i + 1); });
    if (!hits.length) uncovered.push(combo); else if (hits.length > 1) dup.push({ combo, rows:hits });
  }
  return { total, uncovered, dup };
}
const comboStr = combo => state.conditions.map((c, i) => `${c.name}=${combo[i]}`).join(' / ');
function badge(kind, label, details){
  if (!details) return `<span class="badge ${kind}">${escH(label)}</span>`;
  const items = details.slice(0, 40).map(d => `<li>${escH(d)}</li>`).join('') + (details.length > 40 ? `<li>…他 ${details.length - 40} 件</li>` : '');
  return `<details class="badge ${kind}"><summary>${escH(label)}</summary><ul>${items}</ul></details>`;
}
function statusItems(){
  const { rows:R, conditions:C, actions:A } = state;
  const items = [];
  const cov = coverage();
  if (cov && cov.skipped) items.push(badge('', `組み合わせが多いため網羅チェックは省略（${cov.total} 通り）`));
  else if (cov) {
    if (!cov.uncovered.length && !cov.dup.length) items.push(badge('ok', `✔ 全 ${cov.total} 通りを重複なく網羅`));
    if (cov.uncovered.length) items.push(badge('warn', `未カバー ${cov.uncovered.length} 通り`, cov.uncovered.map(comboStr)));
    if (cov.dup.length) items.push(badge('warn', `重複 ${cov.dup.length} 通り`, cov.dup.map(d => `${comboStr(d.combo)}  →  R${d.rows.join(', R')}`)));
  }
  if (A.length) {
    const empty = R.map((r, i) => (!r.na && A.every(a => !actVal(r, a).trim())) ? `R${i+1}` : null).filter(Boolean);
    if (empty.length) items.push(badge('warn', `動作が未入力 ${empty.length} 件`, [empty.join(', ')]));
  }
  const bad = [];
  R.forEach((r, i) => C.forEach(c => { const v = condVal(r, c); if (v !== DASH && !c.values.includes(v)) bad.push(`R${i+1} / ${c.name} = ${v}（値の定義にありません）`); }));
  if (bad.length) items.push(badge('warn', `定義外の値 ${bad.length} 件`, bad));
  const gs = condRuns().map(r => r.group).filter(Boolean);
  const split = uniq(gs.filter((g, i) => gs.indexOf(g) !== i));
  if (split.length) items.push(badge('warn', `離れているグループ ${split.length} 件`, split.map(g => `${g}　→　↑↓ で条件を隣り合わせにするとまとまります`)));
  const na = R.filter(r => r.na).length;
  items.push(badge('', `ルール ${R.length} 件${na ? `（${NA_LABEL} ${na}）` : ''}`));
  items.push('<span class="selinfo" id="selInfo"></span>');
  return items;
}
function renderStatus(){
  dom.status.innerHTML = state.rows.length ? statusItems().join('') : '';
  updateSelUI();
}

/* ======================================================================
 * 出力：Markdown / CSV
 * ====================================================================== */
function matrixToMd(m){
  const w = Array(m[0].length).fill(3);
  m.forEach(r => r.forEach((c, i) => { w[i] = Math.max(w[i], dispW(c)); }));
  const line = r => '| ' + r.map((c, i) => c + ' '.repeat(w[i] - dispW(c))).join(' | ') + ' |';
  return [line(m[0]), '| ' + w.map(x => '-'.repeat(x)).join(' | ') + ' |', ...m.slice(1).map(line)].join('\n');
}
const noteOf = r => { const n = mdEsc(r.note); return r.na ? (n ? `${NA_LABEL}：${n}` : `${NA_LABEL}（発生しない）`) : n; };

/* 表を 2 次元配列にする。Markdown は結合セルを持てないので、向きごとにグループの表し方を変える */
function buildMatrix(layout){
  const { conditions:C, actions:A, rows:R } = state;
  const hasNote = R.some(r => r.na || (r.note || '').trim());
  const groups = hasCondGroups();
  if (layout === 'h') {
    // 横表の見出しは1行しか持てないので、グループ名は列名の前に付ける
    const cHead = c => mdEsc(groupOf(c) ? `${groupOf(c)} / ${c.name}` : c.name);
    const head = ['#', ...C.map(cHead), ...A.map(a => mdEsc(a.name)), ...(hasNote ? ['備考'] : [])];
    const body = R.map((r, i) => [
      r.na ? `~~${i+1}~~` : String(i+1), ...C.map(c => mdEsc(condVal(r, c))), ...A.map(a => mdEsc(actVal(r, a))), ...(hasNote ? [noteOf(r)] : []),
    ]);
    return [head, ...body];
  }
  // 縦表はグループ名を左端の列に置き、2行目以降は空欄にして続きを示す
  const lead = groups ? [''] : [];
  const blankRow = R.map(() => '');
  const out = [[...lead, '', ...R.map((r, i) => ruleLabel(i+1, r.na))]];
  if (C.length) out.push(['**条件**', ...lead, ...blankRow]);
  for (const run of condRuns()) run.items.forEach((c, k) => {
    out.push([...(groups ? [k ? '' : mdEsc(run.group)] : []), mdEsc(c.name), ...R.map(r => mdEsc(condVal(r, c)))]);
  });
  if (A.length) out.push(['**動作 / 結果**', ...lead, ...blankRow]);
  A.forEach(a => out.push([...lead, mdEsc(a.name), ...R.map(r => mdEsc(actVal(r, a)))]));
  if (hasNote) out.push([...lead, '備考', ...R.map(noteOf)]);
  return out;
}
function buildMarkdown(){
  if (!state.rows.length) return '';
  const parts = [matrixToMd(buildMatrix(state.layout))];
  const legend = [];
  if (state.rows.some(r => state.conditions.some(c => condVal(r, c) === DASH))) legend.push('`-` ：この条件は結果に影響しない（どちらでもよい）');
  if (state.rows.some(r => r.na)) legend.push(`\`${NA_LABEL}\` ：発生しない組み合わせ`);
  if (legend.length) parts.push('', ...legend.map(l => '- ' + l));
  return parts.join('\n');
}
function buildCsv(){
  if (!state.rows.length) return '';
  const strip = s => String(s).replace(/\*\*(.*?)\*\*/g, '$1').replace(/~~(.*?)~~/g, '$1').replace(/\\\|/g, '|');
  const esc = v => /[",\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v;
  return buildMatrix(state.layout).map(r => r.map(c => esc(strip(c))).join(',')).join('\n');
}
function copyText(text, what){
  if (!text) return toast('出力する表がありません');
  const done = () => toast(`${what} をクリップボードにコピーしました。Notion のページにそのまま貼り付けできます`);
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed; top:-1000px; left:0; opacity:0;';
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
    ok ? done() : toast('コピーできませんでした。ブラウザのクリップボード権限を確認してください');
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
}

/* ======================================================================
 * 描画のまとめ
 * ====================================================================== */
function commit(){ renderTable(); renderStatus(); persist(); }          // 表に関わる変更のあと
function commitSidebar(){ renderSidebar(); commit(); }                   // 条件・動作の定義が変わったあと
function renderLayoutSeg(){ dom.layoutSeg.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.layout === state.layout)); }
function renderCrumb(){ dom.crumb.textContent = (state.title || '').trim() || '無題'; }
function renderAll(){ dom.title.value = state.title || ''; renderCrumb(); renderLayoutSeg(); commitSidebar(); }
function commitStatus(){ renderStatus(); persist(); }                    // セルの値だけが変わったあと（表は描き直さない）
const refreshTableSoon  = debounce(commit, 120);                         // 名前を打っている間の再描画
const refreshStatusSoon = debounce(commitStatus, 150);                   // セルに文字を打っている間

/* ======================================================================
 * 操作：条件と動作の定義
 * ====================================================================== */
function reorder(arr, id, dir){
  const i = arr.findIndex(x => x.id === id), j = i + dir;
  if (i < 0 || j < 0 || j >= arr.length) return;
  snapshot(); [arr[i], arr[j]] = [arr[j], arr[i]]; commitSidebar();
}
/* 値の定義を変える。record は履歴に載せる関数（クリック操作なら snapshot、入力欄なら touchEdit） */
function setConditionValues(id, vals, record){
  const c = byId(state.conditions, id);
  if (sameList(vals, c.values)) return false;
  record(); c.values = vals; commitSidebar(); return true;
}
function setGroup(id, name){ recordEdit(); byId(state.conditions, id).group = name; commitSidebar(); }

/* 完全に同じルールが残ったら 1 つにする（条件を削除したあとに使う） */
function dedupeRows(){
  const seen = new Set();
  state.rows = state.rows.filter(r => {
    const key = rowKey(r);
    if (seen.has(key)) return false; seen.add(key); return true;
  });
}
function removeCondition(id){
  snapshot();
  state.conditions = state.conditions.filter(c => c.id !== id);
  state.rows.forEach(r => delete r.cond[id]);
  dedupeRows(); commitSidebar(); toast('条件を削除しました', true);
}
function removeAction(id){
  snapshot();
  state.actions = state.actions.filter(a => a.id !== id);
  state.rows.forEach(r => delete r.act[id]);
  commitSidebar(); toast('動作を削除しました', true);
}
/* 条件を追加する。ルールがあれば新しい条件の値ごとに複製して展開する（直前の条件のグループを引き継ぐ） */
function addCondition(){
  snapshot();
  const last = state.conditions[state.conditions.length - 1];
  const c = newCond(`条件${state.conditions.length + 1}`, last ? last.group || '' : '');
  state.conditions.push(c);
  if (state.rows.length && state.rows.length * c.values.length <= MAX_ROWS) {
    state.rows = state.rows.flatMap(r => c.values.map((v, i) => { const nr = i === 0 ? r : cloneRow(r); nr.cond[c.id] = v; return nr; }));
    toast(`条件を追加し、既存ルールを ${state.rows.length} 行に展開しました`, true);
  } else {
    state.rows.forEach(r => r.cond[c.id] = DASH);
  }
  commitSidebar(); focusField(`.item[data-id="${c.id}"] [data-role=cname]`);
}
function addAction(){
  snapshot();
  const a = newAct(`動作${state.actions.length + 1}`);
  state.actions.push(a); state.rows.forEach(r => r.act[a.id] = '');
  commitSidebar(); focusField(`.item[data-id="${a.id}"] [data-role=aname]`);
}

/* ======================================================================
 * 操作：ルール
 * ====================================================================== */
function addRow(){
  if (!state.conditions.length) return toast('先に条件を追加してください');
  snapshot(); state.rows.push(newRow()); commit();
  dom.table.scrollTo({ top:1e9, left:1e9 });
}
/* 全組み合わせを作り直す。既存ルールに当てはまる組み合わせは動作・対象外・備考を引き継ぐ */
function generate(){
  if (!state.conditions.length) return toast('条件を1つ以上追加してください');
  const total = comboTotal();
  if (total > MAX_ROWS) return toast(`組み合わせが ${total} 通りあります。${MAX_ROWS} 通り以下になるよう条件を減らしてください`);
  snapshot();
  const old = state.rows;
  state.rows = cartesian(state.conditions.map(c => c.values)).map(combo => {
    const r = newRow();
    state.conditions.forEach((c, i) => r.cond[c.id] = combo[i]);
    const m = old.find(o => matchesCombo(o, combo));
    if (m) { state.actions.forEach(a => r.act[a.id] = actVal(m, a)); r.na = m.na; r.note = m.note || ''; }
    return r;
  });
  selected.clear(); commit();
  toast(`${state.rows.length} 行を生成しました${old.length ? '（入力済みの動作は引き継ぎました）' : ''}`, true);
}
function deleteRows(){
  const s = needSel(); if (!s) return;
  snapshot(); state.rows = state.rows.filter(r => !selected.has(r.id)); selected.clear(); commit();
  toast(`${s.length} 件のルールを削除しました`, true);
}
/* 選んだルールがすべて対象外なら解除、そうでなければ対象外にする */
function toggleNa(){
  const s = needSel(); if (!s) return;
  const off = s.every(r => r.na);
  snapshot(); s.forEach(r => r.na = !off); commit();
}
/* 選んだルールを前後へ動かす。隣が未選択のときだけ入れ替えるので、まとめて選んでも順序は崩れない */
function moveSel(dir){
  if (!needSel()) return;
  snapshot(); const R = state.rows;
  if (dir < 0) { for (let i = 1; i < R.length; i++) if (selected.has(R[i].id) && !selected.has(R[i-1].id)) [R[i-1], R[i]] = [R[i], R[i-1]]; }
  else { for (let i = R.length - 2; i >= 0; i--) if (selected.has(R[i].id) && !selected.has(R[i+1].id)) [R[i], R[i+1]] = [R[i+1], R[i]]; }
  commit();
}
function toggleSelectAll(){
  if (!state.rows.length) return toast('ルールがありません');
  const all = selected.size === state.rows.length;
  selected.clear();
  if (!all) state.rows.forEach(r => selected.add(r.id));
  renderTable();
}
/* 動作・備考・対象外が同じルール群を、カバーする条件の値の組み合わせにいったん展開してから
 * 「ある条件の全値が出そろった行たちを『-』1 行にする」統合で組み直す。
 * 重複したルール・「-」の行に含まれるルール・「-」同士の重なりもこれで解消される。
 * 組み直しても行数が減らないグループは元のまま残す */
function simplifyRows(){
  if (!state.rows.length) return toast('ルールがありません');
  const before = state.rows.length, json = JSON.stringify(state);

  /* 値の定義にない値を使う行は展開できないので、まとめの対象から外してそのまま残す */
  const stale = r => state.conditions.some(c => { const v = condVal(r, c); return v !== DASH && !c.values.includes(v); });

  /* 動作・備考・対象外が同じルールをグループにする。表の並び順はグループの初出位置で保つ */
  const sig = r => JSON.stringify([r.na, r.note || '', state.actions.map(a => actVal(r, a))]);
  const order = [], byKey = new Map();
  for (const r of state.rows) {
    const k = stale(r) ? null : sig(r);
    const g = k !== null && byKey.get(k);
    if (g) g.rows.push(r);
    else { const e = { rows:[r], fixed:k === null }; order.push(e); if (k !== null) byKey.set(k, e); }
  }

  /* ある条件の全値が出そろった行たちを「-」1 行にする。まとまらなくなるまで繰り返す。
   * rows は state.conditions と同じ並びの値の配列。戻り値は減った行数 */
  const merge = rows => {
    for (let merged = true; merged;) {
      merged = false;
      state.conditions.forEach((c, ci) => {
        const buckets = new Map();
        for (const vals of rows) {
          if (vals[ci] === DASH) continue;
          const k = JSON.stringify(vals.map((v, i) => i === ci ? '' : v));
          (buckets.get(k) || buckets.set(k, []).get(k)).push(vals);
        }
        for (const b of buckets.values()) {
          if (!c.values.every(v => b.some(x => x[ci] === v))) continue;
          b[0][ci] = DASH;
          const drop = new Set(b.slice(1));
          rows = rows.filter(v => !drop.has(v));
          merged = true;
        }
      });
    }
    return rows;
  };

  /* 1 グループを最少の行数に組み直す。減らないときは null（元のまま使う） */
  const expandable = comboTotal() <= MAX_ROWS;   // 組み合わせが多すぎるときは展開せず「-」を保ったまま統合する
  const minimize = grp => {
    let rows;
    if (expandable) {
      const combos = new Set();
      grp.forEach(r => cartesian(state.conditions.map(c => condVal(r, c) === DASH ? c.values : [condVal(r, c)]))
        .forEach(combo => combos.add(JSON.stringify(combo))));
      rows = [...combos].map(s => JSON.parse(s));
    } else {
      /* 重複した行と、他の行（「-」を含む）に包含される行を落としてから統合する */
      const covers = (a, b) => a.every((v, i) => v === DASH || v === b[i]);
      rows = grp.map(r => state.conditions.map(c => condVal(r, c)));
      rows = rows.filter((r, i) => !rows.some((s, j) => i !== j && covers(s, r) && (j < i || !covers(r, s))));
    }
    rows = merge(rows);
    if (rows.length >= grp.length) return null;
    return rows.map(vals => {
      const nr = cloneRow(grp[0]);
      state.conditions.forEach((c, i) => nr.cond[c.id] = vals[i]);
      return nr;
    });
  };

  state.rows = order.flatMap(e => e.fixed || e.rows.length === 1 ? e.rows : (minimize(e.rows) || e.rows));
  if (state.rows.length === before) {
    const why = order.some(e => e.fixed) ? '。値の定義にない値を使う行はまとめられません（状態バーの「定義外の値」を参照）' : '';
    return toast('まとめられるルールはありませんでした' + why);
  }
  pushUndo(json); selected.clear(); commit();
  toast(`${before} 行 → ${state.rows.length} 行にまとめました`, true);
}

/* ルールを選択の直後（選択がなければ末尾）に差し込み、差し込んだものを選択する */
function insertRows(rows, msg){
  snapshot();
  const copies = rows.map(cloneRow), s = selRows();
  state.rows.splice(s.length ? state.rows.indexOf(s[s.length - 1]) + 1 : state.rows.length, 0, ...copies);
  selected = new Set(copies.map(r => r.id)); commit();
  toast(`${copies.length} 件のルールを${msg}`, true);
}
/* 選んだルールをすぐ後ろに複製する（Notion の「複製」と同じ） */
function duplicateRows(){
  const s = needSel(); if (!s) return;
  insertRows(s, '複製しました');
}

/* ルールの右クリックメニュー（Notion の行メニューに合わせる） */
const ROW_ACTS = { dup:duplicateRows, na:toggleNa, up:() => moveSel(-1), down:() => moveSel(1), del:deleteRows };
function openRowMenu(x, y){
  closeRowMenu();
  const t = toggleState();
  const items = [
    ['dup', '複製', `${modKey} + D`],
    ['na', t.naOn ? `${NA_LABEL}を解除` : `${NA_LABEL}にする`, ''],
    ['up', '前へ', `${modKey} + Shift + ←`],
    ['down', '後ろへ', `${modKey} + Shift + →`],
    ['-'],
    ['del', '削除', 'Delete', 'danger'],
  ];
  const menu = dom.rowMenu;
  menu.innerHTML = `<div class="mhead">${selected.size} 件のルール</div>` + items.map(([act, label, key, cls]) => act === '-' ? '<hr>'
    : `<button type="button" role="menuitem" data-act="${act}" class="${cls || ''}">${escH(label)}${key ? `<span class="k">${escH(key)}</span>` : ''}</button>`).join('');
  menu.hidden = false;
  placeMenu(menu, x, y);
  const first = menu.querySelector('button'); if (first) first.focus();
}
function closeRowMenu(){ if (dom.rowMenu.hidden) return; dom.rowMenu.hidden = true; dom.rowMenu.innerHTML = ''; }
/* 右クリックしたルールが選ばれていなければ、それだけを選び直す */
function onTableContextMenu(e){
  if (e.target.matches('input.cell') && inputCell === e.target) return;     // 入力中はブラウザのメニューに任せる
  const hit = e.target.closest('th.rule-h[data-rid], tr[data-rid], td[data-rid]');
  if (!hit) return;
  e.preventDefault();
  const id = +hit.dataset.rid;
  if (!selected.has(id)) { [...selected].forEach(x => setSelected(x, false)); setSelected(id, true); lastClickedRow = id; updateSelUI(); }
  openRowMenu(e.clientX, e.clientY);
}

/* ルールのコピーと貼り付け（このツールの中だけで働く） */
let rowClip = [];
function copyRows(){
  const s = selRows();
  if (!s.length) return toast('コピーするルールを選択してください');
  rowClip = s.map(rowData);
  toast(`${rowClip.length} 件のルールをコピーしました（${modKey} + V で貼り付け）`);
}
function pasteRows(){
  if (!rowClip.length) return toast(`先に ${modKey} + C でルールをコピーしてください`);
  insertRows(rowClip, '貼り付けました');
}

/* 文字を打てるセル（動作・備考）は表を作り直さず、その場だけ更新してフォーカスを保つ */
function onCellInput(el){
  const r = byId(state.rows, +el.dataset.rid); if (!r) return;
  touchEdit();
  if (el.dataset.aid) { r.act[+el.dataset.aid] = el.value; setCellClass(el, markClass(el.value)); }
  else r.note = el.value;
  refreshStatusSoon();
}

/* ======================================================================
 * 直接入力とプルダウンを兼ねた欄
 *   入力欄はそのまま打てる。▾ や ↓ キーで候補の一覧を出し、選ぶと欄に入る。
 *   一覧は画面に1つだけ持ち、開くときに中身と位置を作り直す。
 * ====================================================================== */
const EDIT_OPT = '\u0000edit';   // 候補メニューの「自由入力…」を表す値
let comboInput = null;      // 候補を開いている入力欄
let comboOptions = [];      // 開いている候補の一覧
let comboPick = null;       // 選ばれたときの反映先
let comboActive = -1;       // キーボードで選んでいる位置（-1 = 未選択）

function closeCombo(){
  if (!comboInput) return;
  comboInput.setAttribute('aria-expanded', 'false');
  comboInput.removeAttribute('aria-activedescendant');
  dom.comboMenu.hidden = true;
  dom.comboMenu.innerHTML = '';
  comboInput = null; comboOptions = []; comboPick = null; comboActive = -1;
}
function openCombo(input, options, onPick){
  closeCombo();
  if (!options.length) return;
  comboInput = input; comboOptions = options; comboPick = onPick;
  const cur = input.tagName === 'INPUT' ? input.value : (input.dataset.val ?? '');
  comboActive = options.findIndex(o => o.value === cur);   // 今の値から選び始める
  input.setAttribute('aria-expanded', 'true');
  const menu = dom.comboMenu;
  menu.innerHTML = options.map((o, i) =>
    `<button type="button" role="option" id="comboOpt${i}" data-i="${i}"${o.value === cur ? ' class="cur"' : ''}>${o.color ? tagHtml(o.color, o.label) : escH(o.label)}</button>`).join('');
  menu.hidden = false;
  const r = input.getBoundingClientRect();
  menu.style.cssText = `min-width:${r.width}px; left:0; top:0`;
  const mh = menu.offsetHeight;
  const fitsBelow = window.innerHeight - r.bottom >= mh + 8;   // 下に入らなければ上に出す（上にも入らなければ下）
  placeMenu(menu, r.left, fitsBelow || r.top < mh + 8 ? r.bottom + 4 : r.top - mh - 4);
  menu.querySelectorAll('button').forEach(b => b.addEventListener('click', () => { comboActive = +b.dataset.i; pickCombo(); }));
  paintCombo();
}
/* 選択中の位置を塗り直す。フォーカスは入力欄に置いたままなので、そのまま打ち続けられる */
function paintCombo(){
  const btns = dom.comboMenu.querySelectorAll('button');
  btns.forEach((b, i) => b.classList.toggle('active', i === comboActive));
  if (!comboInput) return;
  if (comboActive < 0) return comboInput.removeAttribute('aria-activedescendant');
  comboInput.setAttribute('aria-activedescendant', 'comboOpt' + comboActive);
  if (btns[comboActive] && btns[comboActive].scrollIntoView) btns[comboActive].scrollIntoView({ block:'nearest' });
}
function moveCombo(step){
  const n = comboOptions.length; if (!n) return;
  comboActive = comboActive < 0 ? (step > 0 ? 0 : n - 1) : (comboActive + step + n) % n;
  paintCombo();
}
function pickCombo(){
  if (comboActive < 0) return closeCombo();
  const v = comboOptions[comboActive].value, pick = comboPick;
  closeCombo(); pick(v);
}
/* 欄の種類（条件セルか、動作セルか、条件のグループ欄か）を見て、候補と反映先を決める */
function openComboFor(input){
  if (input.dataset.cid) {
    const c = byId(state.conditions, +input.dataset.cid), r = byId(state.rows, +input.dataset.rid);
    if (!c || !r) return;
    openCombo(input, condOptions(c), v => {
      if (v !== condVal(r, c)) { snapshot(); r.cond[c.id] = v; }
      replaceCell(input, condCell(r, c));
      commitStatus();
    });
  } else if (input.dataset.aid) {
    const a = byId(state.actions, +input.dataset.aid), r = byId(state.rows, +input.dataset.rid);
    if (!a || !r) return;
    const opts = actionOptions(a);
    if (input.tagName === 'BUTTON') opts.push({ value:EDIT_OPT, label:'自由入力…' });
    openCombo(input, opts, v => {
      if (v === EDIT_OPT) return enterInputMode(input, true);
      if (v !== actVal(r, a)) { recordEdit(); r.act[a.id] = v; }
      if (input.tagName === 'INPUT') { input.value = v; setCellClass(input, markClass(v)); input.focus(); }
      else replaceCell(input, actCell(r, a));
      commitStatus();
    });
  } else if (input.dataset.role === 'cgroup') {
    const item = input.closest('.item'); if (!item) return;
    const id = +item.dataset.id;
    openCombo(input, groupOptions(), v => { setGroup(id, v); focusField(`.item[data-id="${id}"] [data-role=cgroup]`); });
  }
}
/* ---- キーボード操作 ---- */
/* 候補を開いている間のキーは、ほかの処理より先に受け取る（capture 相で登録する） */
function onComboKeydown(e){
  const el = e.target;
  if (!(el.matches && el.matches('.combobox > input, .cell.pick'))) return;
  const stop = () => { e.preventDefault(); e.stopPropagation(); };
  if (comboInput !== el) {
    // 移動モード（readonly）や条件セルでは ↓ をセル移動に使うので、候補は開かない
    if (el.tagName === 'INPUT' && !el.readOnly && (e.key === 'ArrowDown' || e.key === 'F4')) { stop(); openComboFor(el); }
    return;
  }
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { stop(); moveCombo(e.key === 'ArrowDown' ? 1 : -1); }
  else if (e.key === 'Enter') { stop(); pickCombo(); }
  else if (e.key === 'Escape') { stop(); closeCombo(); }
  else if (e.key === 'Tab') closeCombo();     // フォーカス移動はそのまま通す
}

/* ----------------------------------------------------------------------
 * 表のセルは移動モードと入力モードの 2 つを持つ（Notion と同じ考え方）
 *   移動モード … 矢印でセルを移る。入力欄は readonly
 *   入力モード … Enter か文字入力で入る。矢印は文字カーソル。Esc で戻る
 * -------------------------------------------------------------------- */
let inputCell = null;

function enterInputMode(el, selectAll){
  if (!el || inputCell === el) return;
  leaveInputMode();
  if (el.matches('button.cell.act')) {                 // 動作セルはタグのボタンを入力欄に置き換える
    const r = byId(state.rows, +el.dataset.rid), a = byId(state.actions, +el.dataset.aid); if (!r || !a) return;
    el = replaceCell(el, actInput(r, a), false); if (!el) return;
  }
  inputCell = el;
  el.classList.add('editing');
  if (el.tagName === 'INPUT') { el.removeAttribute('readonly'); el.focus(); if (selectAll) el.select(); }
}
function leaveInputMode(){
  if (!inputCell) return;
  closeCombo();
  const el = inputCell; inputCell = null;
  el.classList.remove('editing');
  if (el.dataset.aid && el.tagName === 'INPUT') {      // 動作セルはタグのボタンに戻す
    const r = byId(state.rows, +el.dataset.rid), a = byId(state.actions, +el.dataset.aid);
    if (r && a) replaceCell(el, actCell(r, a), document.activeElement === el);
    return;
  }
  if (el.tagName === 'INPUT') el.setAttribute('readonly', '');
}
/* tbody の行と、その中のセルを並べた格子。縦表でも横表でも「行が見た目の行」になる */
function cellGrid(){
  return [...dom.table.querySelectorAll('tbody tr')]
    .map(tr => [...tr.querySelectorAll('.cell')]).filter(cells => cells.length);
}
/* 格子の中で el の隣を返す。端では動かない（行き止まりなら null） */
function nextCell(grid, el, dRow, dCol){
  let r = -1, c = -1;
  grid.forEach((row, i) => { const j = row.indexOf(el); if (j >= 0) { r = i; c = j; } });
  if (r < 0) return null;
  const row = grid[clamp(r + dRow, 0, grid.length - 1)];
  const next = row && row[clamp(c + dCol, 0, row.length - 1)];
  return next && next !== el ? next : null;
}
function moveCell(el, dRow, dCol){
  const next = nextCell(cellGrid(), el, dRow, dCol);
  leaveInputMode();
  if (!next) return false;
  next.focus();
  if (next.scrollIntoView) next.scrollIntoView({ block:'nearest', inline:'nearest' });
  return true;
}
const ARROWS = { ArrowUp:[-1, 0], ArrowDown:[1, 0], ArrowLeft:[0, -1], ArrowRight:[0, 1] };

function onTableKeydown(e){
  const el = e.target;
  if (!(el.matches && el.matches('.cell')) || comboInput === el) return;
  const inEdit = inputCell === el;
  const stop = () => { e.preventDefault(); e.stopPropagation(); };

  if (e.key === 'Escape') { if (inEdit) { stop(); leaveInputMode(); } return; }
  const pick = el.classList.contains('pick');    // 条件セルは Notion のセレクトと同じで、Enter で一覧が開く
  if (e.key === 'Enter') {
    stop();
    if (pick) return openComboFor(el);
    if (!inEdit) return enterInputMode(el, true);
    moveCell(el, e.shiftKey ? -1 : 1, 0);       // 確定して上下の隣のセルへ
    return;
  }
  if (inEdit) return;                            // 入力モードでは矢印は文字カーソルに任せる
  const d = ARROWS[e.key];
  if (d) { stop(); return moveCell(el, d[0], d[1]); }
  // 移動モードのまま文字を打ったら、そのまま入力モードに入って打ち始められる（条件セルは一覧が開く）
  if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
    if (pick && !el.classList.contains('act')) { stop(); openComboFor(el); } else enterInputMode(el, true);
  }
}

/* ======================================================================
 * 操作：ファイル
 * ====================================================================== */
function saveJson(){
  const json = JSON.stringify(state, null, 2);
  const name = `${(state.title || '').trim().replace(/[\\/:*?"<>|]/g, '_').slice(0, 80) || 'decision-table'}.json`;
  try {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([json], { type:'application/json' })); a.download = name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  } catch (e) {}
  const downloaded = `${name} をダウンロードしました`;
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(json).then(() => toast(`${name} をダウンロードし、同じ内容をクリップボードにもコピーしました`), () => toast(downloaded));
  else toast(downloaded);
}
function loadJsonFile(file){
  const rd = new FileReader();
  rd.onload = () => {
    const s = (() => { try { return validate(JSON.parse(rd.result)); } catch (e) { return null; } })();
    if (s) replaceState(s, `${file.name} を読み込みました`);
    else toast('このファイルは読み込めません。このツールで保存した JSON を選んでください');
  };
  rd.readAsText(file);
}

/* ======================================================================
 * テーマ（自動 → ライト → ダーク）
 * ====================================================================== */
const root = document.documentElement;
const hostTheme = root.getAttribute('data-host-theme') || '';
const THEMES = [
  { id:'auto',  label:'自動',   ic:'◐', title:'表示テーマ：端末の設定に従う（クリックでライトへ）' },
  { id:'light', label:'ライト', ic:'☀', title:'表示テーマ：ライト（クリックでダークへ）' },
  { id:'dark',  label:'ダーク', ic:'☾', title:'表示テーマ：ダーク（クリックで自動へ）' },
];
let themeMode = 'auto';
let themeGuard = null;   // 表示側が data-theme を上書きしても、選んだテーマを保つ監視

function applyTheme(){
  const t = THEMES.find(x => x.id === themeMode) || THEMES[0];
  themeMode = t.id;
  if (themeGuard) { themeGuard.disconnect(); themeGuard = null; }
  if (themeMode === 'auto') {
    if (hostTheme) root.setAttribute('data-theme', hostTheme); else root.removeAttribute('data-theme');
  } else {
    root.setAttribute('data-theme', themeMode);
    themeGuard = new MutationObserver(() => {
      if (root.getAttribute('data-theme') === themeMode) return;
      themeGuard.disconnect();
      root.setAttribute('data-theme', themeMode);
      themeGuard.observe(root, { attributes:true, attributeFilter:['data-theme'] });
    });
    themeGuard.observe(root, { attributes:true, attributeFilter:['data-theme'] });
  }
  dom.themeBtn.innerHTML = `<span class="ic">${t.ic}</span>${t.label}`;
  dom.themeBtn.title = t.title;
  dom.themeBtn.setAttribute('aria-label', `表示テーマ：${t.label}。クリックで切り替え`);
}
function cycleTheme(){
  themeMode = THEMES[(THEMES.findIndex(x => x.id === themeMode) + 1) % THEMES.length].id;
  try { localStorage.setItem(THEME_KEY, themeMode); } catch (e) {}
  applyTheme();
  toast(`表示テーマを「${THEMES.find(x => x.id === themeMode).label}」にしました`);
}

/* ======================================================================
 * ショートカット一覧
 * ====================================================================== */
const isMac = /Mac|iPhone|iPad|iPod/.test((navigator.userAgentData && navigator.userAgentData.platform) || navigator.platform || navigator.userAgent);
const modKey = isMac ? '⌘' : 'Ctrl';
/* ['#', 見出し] は区切り行。それ以外は [操作, Windows, Mac] */
const KEYS = [
  ['#', '表のセル：移動モード（セルが青く塗られている状態）'],
  ['セルを移る', '↑ ↓ ← →', '↑ ↓ ← →'],
  ['入力モードに入る（動作・備考）', 'Enter　または　そのまま文字を打つ', 'Enter　または　そのまま文字を打つ'],
  ['隣の欄へ', 'Tab / Shift + Tab', 'Tab / Shift + Tab'],
  ['条件・動作の候補を開く', 'Enter　または　クリック', 'Enter　または　クリック'],
  ['#', '表のセル：入力モード（白くなり文字カーソルが出ている状態）'],
  ['移動モードに戻る', 'Esc', 'Esc'],
  ['確定して下／上のセルへ', 'Enter / Shift + Enter', 'Enter / Shift + Enter'],
  ['動作セルの候補を開く（入力中）', '↓　または　F4', '↓'],
  ['候補を選ぶ', '↑ / ↓', '↑ / ↓'],
  ['候補を決める', 'Enter', 'Enter'],
  ['候補だけ閉じる', 'Esc', 'Esc'],
  ['#', 'ルールの操作'],
  ['元に戻す', 'Ctrl + Z', '⌘ + Z'],
  ['やり直す', 'Ctrl + Shift + Z　または　Ctrl + Y', '⌘ + Shift + Z'],
  ['選んだルールを複製', 'Ctrl + D', '⌘ + D'],
  ['選んだルールを削除', 'Delete', 'Delete'],
  ['ルールのメニューを開く', '右クリック', '右クリック'],
  ['選んだルールをコピー', 'Ctrl + C', '⌘ + C'],
  ['コピーしたルールを貼り付け', 'Ctrl + V', '⌘ + V'],
  ['選んだルールを前へ／後ろへ', 'Ctrl + Shift + ← / →', '⌘ + Shift + ← / →'],
  ['ルールを続けて選ぶ', 'Shift + クリック', 'Shift + クリック'],
  ['選択を解除', 'Esc', 'Esc'],
  ['この一覧を開く', '?', '?'],
];
function renderKeys(){
  const col = (label, mine) => `<th class="${mine ? 'here' : ''}">${label}${mine ? ' （このPC）' : ''}</th>`;
  dom.keysHead.innerHTML = `<tr><th>操作</th>${col('Windows', !isMac)}${col('Mac', isMac)}</tr>`;
  dom.keysBody.innerHTML = KEYS.map(([a, b, c]) => a === '#'
    ? `<tr class="sec"><th colspan="3">${escH(b)}</th></tr>`
    : `<tr><td>${escH(a)}</td><td class="k ${isMac ? '' : 'here'}">${escH(b)}</td><td class="k ${isMac ? 'here' : ''}">${escH(c)}</td></tr>`).join('');
}
function openKeys(){ if (dom.keysDlg.showModal && !dom.keysDlg.open) dom.keysDlg.showModal(); }

/* ======================================================================
 * イベント接続
 * ====================================================================== */
/* サイドバーの操作は data-role で振り分ける。第1引数は属する条件／動作の id */
const sidebarOn = {
  click: {
    preset:  (id, btn) => setConditionValues(id, parseValues(btn.dataset.vals), snapshot),
    cdel:    id => removeCondition(id),
    adel:    id => removeAction(id),
    cup:     id => reorder(state.conditions, id, -1),
    cdown:   id => reorder(state.conditions, id, 1),
    aup:     id => reorder(state.actions, id, -1),
    adown:   id => reorder(state.actions, id, 1),
  },
  input: {
    cname:  (id, el) => { touchEdit(); byId(state.conditions, id).name = el.value; refreshTableSoon(); },
    aname:  (id, el) => { touchEdit(); byId(state.actions, id).name = el.value; refreshTableSoon(); },
    cgroup: (id, el) => { touchEdit(); byId(state.conditions, id).group = el.value; el.closest('.item').classList.toggle('grouped', !!el.value.trim()); refreshTableSoon(); },
  },
  change: {
    cvals:  (id, el) => { if (!setConditionValues(id, parseValues(el.value), touchEdit)) el.value = byId(state.conditions, id).values.join(', '); },
    cgroup: () => commitSidebar(),     // 入力が終わったら候補の一覧を作り直す
  },
};
function dispatchSidebar(kind, e){
  const el = kind === 'click' ? e.target.closest('button[data-role]') : e.target;
  const fn = el && sidebarOn[kind][el.dataset.role]; if (!fn) return;
  const item = el.closest('.item');
  fn(item ? +item.dataset.id : null, el);
}

function onKeydown(e){
  if (dom.keysDlg.open) return;                         // 一覧を開いている間は Esc で閉じるだけにする
  const inText = e.target.matches('input[type=text], textarea');
  const inCell = e.target.matches('.cell');
  if (!(e.ctrlKey || e.metaKey)) {
    if (e.key === 'Escape' && !dom.rowMenu.hidden) closeRowMenu();
    else if (e.key === 'Escape' && selected.size) { selected.clear(); renderTable(); }
    else if (e.key === '?' && !inText) { e.preventDefault(); openKeys(); }
    else if ((e.key === 'Delete' || e.key === 'Backspace') && selected.size && !inText && !inCell) { e.preventDefault(); deleteRows(); }
    return;
  }
  if (inText && !(e.target.readOnly && e.key.toLowerCase() === 'd')) return;   // 文字を入力している間は本来の編集操作にゆずる
  if (e.shiftKey && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) { e.preventDefault(); return moveSel(e.key === 'ArrowLeft' ? -1 : 1); }
  const actions = { z: () => e.shiftKey ? redo() : undo(), y: redo, c: copyRows, v: pasteRows, d: duplicateRows };
  const k = e.key.toLowerCase();
  if (Object.hasOwn(actions, k)) { e.preventDefault(); actions[k](); }
}

function bindEvents(){
  const on = (sel, ev, fn) => $(sel).addEventListener(ev, fn);

  // ヘッダー
  dom.title.addEventListener('focus', beginEdit);
  dom.title.addEventListener('input', e => { touchEdit(); state.title = e.target.value; renderCrumb(); persist(); });
  on('#sampleBtn', 'click', () => replaceState(sample(), 'サンプルを読み込みました'));
  on('#newBtn', 'click', () => replaceState(starter(), '新しい表を作成しました'));
  on('#saveJsonBtn', 'click', saveJson);
  on('#loadJsonBtn', 'click', () => dom.jsonFile.click());
  dom.jsonFile.addEventListener('change', e => { const f = e.target.files[0]; if (f) loadJsonFile(f); e.target.value = ''; });
  on('#keysBtn', 'click', openKeys);
  dom.keysDlg.addEventListener('click', e => { if (e.target === dom.keysDlg) dom.keysDlg.close(); });
  dom.themeBtn.addEventListener('click', cycleTheme);

  // サイドバー
  ['click', 'input', 'change'].forEach(kind => dom.sidebar.addEventListener(kind, e => dispatchSidebar(kind, e)));
  dom.sidebar.addEventListener('focusin', e => { if (e.target.matches('input[type=text]')) beginEdit(); });
  on('#addConditionBtn', 'click', addCondition);
  on('#addActionBtn', 'click', addAction);
  on('#addRowBtn', 'click', addRow);
  on('#generateBtn', 'click', generate);

  // ツールバー
  dom.layoutSeg.addEventListener('click', e => {
    const b = e.target.closest('button[data-layout]'); if (!b || b.dataset.layout === state.layout) return;
    state.layout = b.dataset.layout; renderLayoutSeg(); renderTable(); persist();
  });
  dom.naBtn.addEventListener('click', toggleNa);
  dom.deleteBtn.addEventListener('click', deleteRows);
  on('#simplifyBtn', 'click', simplifyRows);
  dom.selToggle.addEventListener('click', toggleSelectAll);
  on('#copyMdBtn', 'click', () => copyText(buildMarkdown(), 'Markdown'));
  on('#copyCsvBtn', 'click', () => copyText(buildCsv(), 'CSV'));

  // 表
  dom.table.addEventListener('click', e => {
    const cb = e.target.closest('.rowsel');
    if (cb) {
      const id = +cb.dataset.rid;
      if (e.shiftKey && lastClickedRow !== null) selectRange(id, cb.checked); else setSelected(id, cb.checked);
      lastClickedRow = id; updateSelUI(); return;
    }
    if (e.target.id === 'selAllChk') { state.rows.forEach(r => setSelected(r.id, e.target.checked)); updateSelUI(); return; }
    if (e.target.closest('.addrow, .addcol')) return addRow();
    // マウスで触ったセルは、そのまま入力モードにする（条件セルは値の一覧を開く）
    const box = e.target.closest('.combobox');
    const cell = e.target.closest('.cell') || (box && box.querySelector('.cell'));
    if (!cell) return;
    if (cell.classList.contains('pick')) { if (comboInput === cell) closeCombo(); else openComboFor(cell); return; }
    enterInputMode(cell, false);
  });
  dom.table.addEventListener('contextmenu', onTableContextMenu);
  dom.rowMenu.addEventListener('click', e => { const b = e.target.closest('button[data-act]'); if (!b) return; closeRowMenu(); ROW_ACTS[b.dataset.act](); });
  dom.rowMenu.addEventListener('keydown', e => {
    const btns = [...dom.rowMenu.querySelectorAll('button')], i = btns.indexOf(document.activeElement);
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); btns[(i + (e.key === 'ArrowDown' ? 1 : -1) + btns.length) % btns.length].focus(); }
  });
  dom.table.addEventListener('focusin', e => { if (e.target.matches('input.cell')) beginEdit(); });
  dom.table.addEventListener('focusout', e => { if (inputCell === e.target) leaveInputMode(); });
  dom.table.addEventListener('input', e => { if (e.target.matches('input.cell')) onCellInput(e.target); });
  dom.table.addEventListener('keydown', onTableKeydown);

  // 直接入力＋プルダウンの欄
  document.addEventListener('click', e => {
    const caret = e.target.closest && e.target.closest('.combobox .caret');
    if (!caret) return;
    e.preventDefault();
    const input = caret.previousElementSibling;
    if (comboInput === input) closeCombo(); else openComboFor(input);
  });
  document.addEventListener('mousedown', e => {
    if (comboInput && !dom.comboMenu.contains(e.target) && !(e.target.closest && e.target.closest('.combobox, .cell.pick'))) closeCombo();
    if (!dom.rowMenu.hidden && !dom.rowMenu.contains(e.target)) closeRowMenu();
  });
  document.addEventListener('keydown', onComboKeydown, true);
  dom.comboMenu.addEventListener('mousedown', e => e.preventDefault());   // 入力欄からフォーカスを奪わない
  document.addEventListener('input', e => { if (comboInput === e.target) closeCombo(); });
  window.addEventListener('scroll', () => { closeCombo(); closeRowMenu(); }, true);

  // 全体
  document.addEventListener('keydown', onKeydown);
  window.addEventListener('resize', debounce(() => { closeCombo(); closeRowMenu(); layoutSticky(); }, 150));
}

/* ======================================================================
 * 起動
 * ====================================================================== */
try { const saved = localStorage.getItem(THEME_KEY); if (THEMES.some(x => x.id === saved)) themeMode = saved; } catch (e) {}
applyTheme();
renderKeys();
bindEvents();
state = load(); fixUid(); renderAll();
})();
</script>
