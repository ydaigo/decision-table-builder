<!DOCTYPE html>
<meta charset="utf-8">
<title>sticky check</title>
<style>html,body{margin:0} iframe{width:1360px;height:820px;border:0}</style>
<pre id="out">running</pre>
<script>
const LS = 'decision-table-builder.v2';
const lines = [];
let failed = 0;
const check = (name, ok, detail) => { if (!ok) failed++; lines.push(`${ok ? 'ok   ' : 'FAIL '} ${name}${detail ? ` — ${detail}` : ''}`); };

/* 縦にも横にも画面からあふれる大きさの表 */
function bigState(layout){
  let id = 1;
  const conditions = Array.from({length:20}, (_, i) => ({ id:id++, name:`条件${i+1}`, values:['○','×'], group:i < 4 ? 'グループA' : '' }));
  const actions = Array.from({length:6}, (_, i) => ({ id:id++, name:`動作${i+1}` }));
  const rows = Array.from({length:30}, () => ({
    id:id++, na:false, note:'',
    cond:Object.fromEntries(conditions.map(c => [c.id, '○'])),
    act:Object.fromEntries(actions.map(a => [a.id, '○'])),
  }));
  return { title:'sticky check', conditions, actions, rows, layout };
}

function measure(win, layout){
  const wrap = win.document.getElementById('tableWrap');
  const t = wrap.querySelector('table.dt');
  if (!t) return check(`${layout}: 表が描画される`, false);
  check(`${layout}: 縦にも横にもスクロールできる`,
    wrap.scrollWidth > wrap.clientWidth && wrap.scrollHeight > wrap.clientHeight,
    `scrollW=${wrap.scrollWidth} clientW=${wrap.clientWidth} scrollH=${wrap.scrollHeight} clientH=${wrap.clientHeight}`);

  const q = sel => t.querySelector(sel);
  const r = sel => { const el = q(sel); return el && el.getBoundingClientRect(); };
  const near = (a, b) => Math.abs(a - b) <= 2;
  const px = n => Math.round(n);
  const cssVar = n => parseFloat(win.getComputedStyle(t).getPropertyValue(n)) || 0;

  const scrollTo = (x, y) => { wrap.scrollLeft = x; wrap.scrollTop = y; };
  /* 固定の基準はスクロールする範囲の内側の角（余白は border で取っているのでその内側） */
  const origin = () => {
    const box = wrap.getBoundingClientRect(), cs = win.getComputedStyle(wrap);
    return { x:box.left + parseFloat(cs.borderLeftWidth), y:box.top + parseFloat(cs.borderTopWidth), box };
  };
  const atLeft = (name, sel, offset = 0) => {
    const o = origin(), b = r(sel);
    check(name, !!b && b.width > 0 && near(b.left, o.x + offset), b ? `left=${px(b.left)} 期待=${px(o.x + offset)}` : 'セルなし');
  };
  const atTop = (name, sel, offset = 0) => {
    const o = origin(), b = r(sel);
    check(name, !!b && b.height > 0 && near(b.top, o.y + offset), b ? `top=${px(b.top)} 期待=${px(o.y + offset)}` : 'セルなし');
  };
  /* 見出し行が上に積み重なって固定されているか */
  const headStacked = name => {
    const o = origin(), rows = [...t.querySelectorAll('thead tr')];
    let expect = o.y, ok = rows.length > 0, detail = [];
    for (const tr of rows) {
      const b = tr.querySelector('th').getBoundingClientRect();   // 固定されているのは行ではなくセル
      detail.push(`${px(b.top)}/${px(expect)}`);
      if (!near(b.top, expect)) ok = false;
      expect += b.height;
    }
    check(name, ok, `実際/期待 = ${detail.join(', ')}`);
  };

  /* 固定したものはスクロールしてもまったく動かない（少しずれてから止まる、ということがない） */
  const frozenSelectors = layout === 'v'
    ? { 'グループ列':'tbody th.gname', '条件名・動作名の列':'tbody th.lbl', '見出し行':'thead th.corner' }
    : { 'チェック列':'tbody td.chk', 'ルール番号の列':'tbody td.no', '見出し行':'thead th.chk' };
  scrollTo(0, 0);
  const at0 = Object.fromEntries(Object.entries(frozenSelectors).map(([k, s]) => [k, r(s)]));
  const slips = [];
  for (const shift of [1, 5, 20, 48, 120, 400]) {
    scrollTo(shift, shift);
    for (const [k, s] of Object.entries(frozenSelectors)) {
      const now = r(s), was = at0[k];
      const moved = k === '見出し行' ? now.top - was.top : now.left - was.left;   // 列は左、見出し行は上を見る
      if (Math.abs(moved) > 0.5) slips.push(`${k}が ${shift}px スクロールで ${px(moved)}px ずれた`);
    }
  }
  check(`${layout}: 固定したものはスクロールしても少しも動かない`,
    slips.length === 0, slips.length ? slips.join(' / ') : Object.keys(frozenSelectors).join('・'));

  scrollTo(wrap.scrollWidth, wrap.scrollHeight);   // 右下の端まで送る
  if (layout === 'v') {
    const gw = cssVar('--gw'), headh = cssVar('--headh');
    headStacked('v: ルール番号の見出し行が上に固定されている');
    atLeft('v: グループ列が左に固定されている', 'tbody th.gname');
    atLeft('v: 条件名・動作名の列がグループ列の右に固定されている', 'tbody th.lbl', gw);
    atLeft('v: 左上の角が左に固定されている', 'thead th.gname.corner');
    atTop ('v: 区分（条件/動作）の見出しが見出し行の下に固定されている', 'tr.grp th.sect', headh);
    atLeft('v: 区分の見出しの文字が左に残っている', 'tr.grp th.sect .sect-l');
    const o = origin(), add = r('thead th.addcol');
    check('v: 「+ 新規」列は固定せず流れる（固定は見出しと左の列だけ）', add.right < o.box.right + 1, `right=${px(add.right)}`);
  } else {
    const chkw = cssVar('--chkw'), frozen = cssVar('--frozenw');
    headStacked('h: 見出し行（区分・グループ・条件名）が上に積み重なって固定されている');
    atLeft('h: チェック列が左に固定されている', 'tbody td.chk');
    atLeft('h: ルール番号の列がチェック列の右に固定されている', 'tbody td.no', chkw);
    /* ラベルは自分のセルが見えている間だけ固定される。固定した列に隠れず、表示領域の中にいればよい */
    const labelVisible = (name, sel) => {
      const o = origin(), b = r(sel);
      check(name, !!b && b.width > 0 && b.left >= o.x + frozen - 2 && b.right <= o.box.right + 1,
        b ? `left=${px(b.left)} 最小=${px(o.x + frozen)} right=${px(b.right)}` : 'セルなし');
    };
    labelVisible('h: 「条件」のラベルが固定した列に隠れず見えている', 'thead tr.grp th.cond-h .sect-l');
    labelVisible('h: 「動作 / 結果」のラベルが固定した列に隠れず見えている', 'thead tr.grp th.act-h .sect-l');
    atLeft('h: 「+ 新規」の文字が左に残っている', 'td.addrow .sect-l');
    const c = r('tbody td.chk'), n = r('tbody td.no');
    check('h: チェック列と番号列が重ならない', n.left >= c.right - 1, `chk.right=${px(c.right)} no.left=${px(n.left)}`);
    /* グループ名はその列がある間だけ固定される。横に送った量よりラベルの動きが小さく、
       固定した列にも隠れていなければ、ついてきていると言える */
    const sel = 'thead tr.gsub th.gspan .sect-l';
    scrollTo(0, 0);
    const cell = q(sel).parentElement.getBoundingClientRect(), at0 = r(sel).left;
    const step = Math.round(at0 - origin().x - frozen) + 60;   // ラベルが固定し始めるところまで送る
    scrollTo(step, 0);
    const now = r(sel), o = origin();
    check('h: グループ名のラベルが横スクロールについてくる',
      now.left > at0 - step + 2 && now.left >= o.x + frozen - 2 && now.right <= o.box.right + 1,
      `セル=(${px(cell.left)}-${px(cell.right)}) left: ${px(at0)} → ${px(now.left)}（${step}px 送った。固定なしなら ${px(at0 - step)}、最小 ${px(o.x + frozen)}）`);
  }
}

function run(layout, next){
  localStorage.setItem(LS, JSON.stringify(bigState(layout)));
  const f = document.createElement('iframe');
  f.src = location.hash.slice(1) || 'index.html';
  f.onload = () => {
    try { measure(f.contentWindow, layout); } catch (e) { check(`${layout}: 測定`, false, String(e)); }
    f.remove(); next();
  };
  document.body.appendChild(f);
}

run('v', () => run('h', () => {
  document.getElementById('out').textContent = lines.join('\n') + (failed ? `\n\n${failed} 件失敗` : '\n\nすべて成功');
}));
</script>
